# .github/workflows/release.yml
name: Release

on:
  push:
    branches:
      - master
      - next
      - alpha
      - beta

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install

      - name: Debug npm OIDC token exchange
        run: |
          set +e
          echo "=== Requesting OIDC token for npm audience ==="
          TOKEN=$(curl -sSL \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            -H "Accept: application/json" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm" | jq -r .value)
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Failed to obtain OIDC token"; exit 1
          fi
          echo "OIDC token obtained ($(echo -n "$TOKEN" | wc -c) chars)"
          echo ""

          # Try a few candidate package URL encodings — see which (if any) npm accepts
          PKG_RAW="@opekunov/vue-spring-bottom-sheet"
          PKG_ENC="%40opekunov%2Fvue-spring-bottom-sheet"

          for PKG in "$PKG_RAW" "$PKG_ENC"; do
            echo "=== Trying npm exchange for: $PKG ==="
            URL="https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${PKG}"
            echo "URL: $URL"
            RESP=$(curl -sS -o /tmp/body.txt -w "HTTP %{http_code}\n" \
              -X POST "$URL" \
              -H "Content-Type: application/json" \
              -d "{\"jwt\":\"$TOKEN\"}")
            echo "$RESP"
            echo "Response body:"
            cat /tmp/body.txt | head -c 2000
            echo ""
            echo ""
          done

          echo "=== Trying npm trusted publisher info endpoint ==="
          curl -sS -o /tmp/info.txt -w "HTTP %{http_code}\n" \
            "https://registry.npmjs.org/-/package/${PKG_ENC}/access"
          cat /tmp/info.txt | head -c 2000
          echo ""

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run semantic-release
